project:
  type: website
  output-dir: docs          # GitHub Pages serves the site from this folder
  resources:
    - files/                # copies your JMP and CV PDFs into the website
    - google*.html          # Google Search Console verification file

website:
  title: "Thomar P. van Hees"
  search: false
  site-url: "https://thomarvanhees.github.io"
  description: "Thomar P. van Hees, economist (PhD, Tor Vergata). Research in monetary economics, banking and macro-finance. 2026–27 job market candidate."

  navbar:
    background: light
    right:
      - text: "Research"
        href: index.qmd#research
      - text: "Teaching"
        href: index.qmd#teaching
      - text: "CV"
        href: files/CV.pdf
      - text: "Contact"
        href: index.qmd#contact
  page-footer:
    left: "Thomar P. van Hees · Last updated October 2026"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    page-layout: article
    smooth-scroll: true
    link-external-newwindow: true
